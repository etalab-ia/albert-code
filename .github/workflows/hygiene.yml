name: hygiene

# Garde-fous de propreté du dépôt PUBLIC albert-code (pas les templates livrés
# aux projets utilisateurs, cf. BACKLOG.md T4.5).
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garde-fou cohérence registre et validité workflows (T14.4)
        run: bash tests/check_registry_consistency.sh

      - name: Garde-fou anti-fuite chemin personnel / username (T4.5 <- AC-R008)
        run: bash tests/check_no_personal_paths.sh

      - name: Vérification syntaxique des scripts bash
        run: |
          for f in install.sh uninstall.sh lib/*.sh runtime/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Test S15 — shim agent-vm (sandbox jetable, non-destructif)
        run: bash tests/s15_shim.sh

      - name: Test S67 — PATH du shim dans le fichier rc du shell détecté (T5.4)
        run: bash tests/s67_shim_path_rc.sh

      - name: Test S69 — zone gérée des AGENTS.md de projet (T8.5)
        run: bash tests/s69_agents_zone.sh

      - name: Test S68 — baseURL Albert surchargeable (T1.9)
        run: bash tests/s68_albert_base_url.sh

      - name: Test S71 — VM de base à moitié provisionnée (T7.9)
        run: bash tests/s71_base_vm_complete.sh

      - name: Test S70 — exclusions locales .git/info/exclude (T6.18)
        run: bash tests/s70_git_exclude.sh

      - name: Test S73 — retex install macOS (GitHub, espaces de chemin, ressources VM) (T14.x)
        run: bash tests/s73_retex_macos.sh

      - name: Test S75 — retrait avertissement Node et bruit Homebrew (AC-R068, AC-R069)
        run: bash tests/s75_node_et_bruit_brew.sh
